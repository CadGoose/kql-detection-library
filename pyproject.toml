[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kqldl"
version = "1.0.0"
description = "Validate, export and document a library of Microsoft Sentinel / Defender XDR KQL detections."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "George Mkahail" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kqldl = "kqldl.cli:main"

[tool.setuptools]
packages = ["kqldl"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine for embedded HTML/KQL

[tool.pytest.ini_options]
testpaths = ["tests"]
