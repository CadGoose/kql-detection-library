id: KDL-0012
name: Credentials added to an application or service principal
description: >
  Adding a client secret or certificate to an existing app registration or service
  principal lets an attacker authenticate as that app with whatever Graph
  permissions it already holds - often far more than any single user. Seen in
  real-world tenant compromises (e.g. Solorigate, Midnight Blizzard).
severity: Medium
status: stable
platforms: [Sentinel]
data_sources: [AuditLogs]
tactics: [Persistence, PrivilegeEscalation]
techniques: [T1098.001]
query_frequency: PT1H
query_period: PT1H
query: |
  AuditLogs
  | where TimeGenerated > ago(1h)
  | where OperationName has_any ("Add service principal credentials", "Certificates and secrets management")
  | where Result == "success"
  | extend Actor = coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))
  | extend ActorIP = tostring(InitiatedBy.user.ipAddress)
  | extend AppName = tostring(TargetResources[0].displayName), ObjectId = tostring(TargetResources[0].id)
  | mv-apply prop = TargetResources[0].modifiedProperties on (
      where tostring(prop.displayName) == "KeyDescription"
      | extend NewKeys = tostring(prop.newValue), OldKeys = tostring(prop.oldValue)
    )
  | extend KeyType = case(NewKeys has "KeyType=AsymmetricX509Cert", "Certificate",
                          NewKeys has "KeyType=Password", "ClientSecret", "Unknown")
  | project TimeGenerated, OperationName, Actor, ActorIP, AppName, ObjectId, KeyType, NewKeys
entity_mappings:
  - entity: Account
    field: FullName
    column: Actor
false_positives:
  - Scheduled secret rotation by a known automation account or DevOps pipeline.
tuning:
  - Exclude the rotation pipeline's service principal by object ID, not display name.
references:
  - https://attack.mitre.org/techniques/T1098/001/
