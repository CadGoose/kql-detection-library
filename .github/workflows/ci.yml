name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: kqldl validate
      - run: pytest -q
      - run: kqldl export-arm -o dist/sentinel-analytics-rules.json
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-analytics-rules
          path: dist/sentinel-analytics-rules.json
